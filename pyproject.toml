[build-system]
requires = [
    "setuptools>=42",
    "setuptools_scm[toml]>=6.2",
    "wheel",
    "cibuildwheel >= 2.0.0",
    "gitpython",
]
build-backend="setuptools.build_meta"

[project]
name="gsf"
requires-python=">=3.13"
authors = [
    {name = "Morishita Takahiro", email = "morishita@astr.tohoku.ac.jp"},
]
dependencies = [
#    'asdf',
#    'astropy',
#    'colorama',
#    'corner',
#    'dust_extinction',
#    'emcee',
#    'fsps>=0.4.7',
#    'lmfit',
#    'multiprocess',
#    'numpy>=1.21',
#    'pandas',
#    'pytest',
#    'scipy>=1.5.1',
#    'specutils',
#    'sphinx_automodapi',
#    'zeus-mcmc'
]

dynamic=["version","readme"]

[tool.setuptools.dynamic]
readme = {file = ["README.rst"]}

[tool.setuptools_scm]
write_to = "gsf/version.py"

[tool.setuptools]
package-dir = {'gsf'='gsf'}
